[package]
name = "bevy_horizon"
version = "0.1.0"
edition = "2024"
authors = ["Horizon Community"]
description = "Bevy ECS adapter crate for Horizon native Minecraft mods"
license = "MIT"

[dependencies]
bevy_ecs = { version = "0.20", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
